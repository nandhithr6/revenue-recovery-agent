<svg viewBox="0 0 1040 268" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <clipPath id="barclip"><rect x="20" y="50" width="1000" height="46" rx="8"/></clipPath>
    <style>
      .h { fill:#0d1526; font-size:15px; font-weight:700; }
      .lk { fill:#0d1526; font-size:12.5px; font-weight:700; }
      .lv { fill:#4c5670; font-size:11.5px; }
      .pct { fill:#ffffff; font-size:12px; font-weight:700; }
    </style>
  </defs>

  <rect x="0" y="0" width="1040" height="268" rx="14" fill="#ffffff" stroke="#e3e8f2" stroke-width="1.5"/>

  <text class="h" x="20" y="28">Of 500 simulated failures, 297 recovered (59.4%) — where the other 203 actually went</text>

  <g clip-path="url(#barclip)">
    <rect x="20"  y="50" width="594" height="46" fill="#0ca30c"/>
    <rect x="614" y="50" width="104" height="46" fill="#a9b2c6"/>
    <rect x="718" y="50" width="296" height="46" fill="#1655d1"/>
    <rect x="1014" y="50" width="6"   height="46" fill="#d03b3b"/>
  </g>
  <rect x="20" y="50" width="1000" height="46" rx="8" fill="none" stroke="#cdd6e8" stroke-width="1"/>
  <text class="pct" x="317" y="78" text-anchor="middle">59.4% recovered</text>

  <!-- callout pointing at the sliver -->
  <path d="M1017,96 V116 H760 V132" stroke="#8590a8" stroke-width="1.2" fill="none"/>
  <text class="lv" x="756" y="144" text-anchor="end" font-style="italic">3 cases (0.6%) — the only real misses, see below</text>

  <!-- legend: four rows -->
  <g transform="translate(20,164)">
    <rect x="0" y="0" width="14" height="14" rx="3" fill="#0ca30c"/>
    <text class="lk" x="22" y="11">Recovered — 297 cases (59.4%)</text>

    <rect x="0" y="24" width="14" height="14" rx="3" fill="#a9b2c6"/>
    <text class="lk" x="22" y="35">Never realistically recoverable — 52 cases · ₹2.89L at risk</text>
    <text class="lv" x="22" y="50">hard declines, no consented channel ever available, or unsafe to verify further</text>
  </g>

  <g transform="translate(560,164)">
    <rect x="0" y="0" width="14" height="14" rx="3" fill="#1655d1"/>
    <text class="lk" x="22" y="11">Correctly handled, real odds didn't land — 148 cases · ₹5.82L</text>
    <text class="lv" x="22" y="26">stopped once true expected value went to zero, or tried and simply lost the odds</text>

    <rect x="0" y="44" width="14" height="14" rx="3" fill="#d03b3b"/>
    <text class="lk" x="22" y="55">Genuine miss — 3 cases · ₹7,372 at risk</text>
    <text class="lv" x="22" y="70">ground truth shows a rejected candidate had real positive value the agent's pricing missed</text>
  </g>

  <text class="lv" x="20" y="256" fill="#8590a8">Every case reclassified against ground truth, not the agent's own belief — see the live dashboard's outcome breakdown for all 203 by name.</text>
</svg>
