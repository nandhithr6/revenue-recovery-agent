<svg viewBox="0 0 1040 190" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <style>
      .card { fill:#ffffff; stroke:#e3e8f2; stroke-width:1.5; }
      .bar { fill:#1655d1; }
      .val { fill:#0d1526; font-size:40px; font-weight:700; }
      .lbl { fill:#4c5670; font-size:13px; font-weight:600; letter-spacing:0.6px; }
      .sub { fill:#8590a8; font-size:11.5px; }
      .note { fill:#8590a8; font-size:10px; font-style:italic; }
    </style>
  </defs>
  <rect width="1040" height="190" fill="none"/>

  <g transform="translate(0,0)">
    <rect class="card" x="0" y="0" width="245" height="180" rx="12"/>
    <rect class="bar" x="0" y="0" width="5" height="180" rx="2"/>
    <text class="val" x="26" y="76">₹5.97L</text>
    <text class="lbl" x="26" y="106">NET RECOVERED</text>
    <text class="sub" x="26" y="128">baseline week · 500 cases</text>
  </g>

  <g transform="translate(265,0)">
    <rect class="card" x="0" y="0" width="245" height="180" rx="12"/>
    <rect class="bar" x="0" y="0" width="5" height="180" rx="2"/>
    <text class="val" x="26" y="76">59.4%</text>
    <text class="lbl" x="26" y="106">RECOVERY RATE</text>
    <text class="sub" x="26" y="128">297 of 500 cases</text>
    <line x1="26" y1="140" x2="219" y2="140" stroke="#e3e8f2" stroke-width="1"/>
    <text class="note" x="26" y="156">of the other 203, just 3 were</text>
    <text class="note" x="26" y="169">a genuine miss — see below</text>
  </g>

  <g transform="translate(530,0)">
    <rect class="card" x="0" y="0" width="245" height="180" rx="12"/>
    <rect x="0" y="0" width="5" height="180" fill="#0ca30c" rx="2"/>
    <text x="26" y="76" style="fill:#0a7d0a;font-size:40px;font-weight:700">250/250</text>
    <text class="lbl" x="26" y="106">ROBUSTNESS</text>
    <text class="sub" x="26" y="128">independent reseeded cohorts</text>
  </g>

  <g transform="translate(795,0)">
    <rect class="card" x="0" y="0" width="245" height="180" rx="12"/>
    <rect x="0" y="0" width="5" height="180" fill="#0ca30c" rx="2"/>
    <text x="26" y="76" style="fill:#0a7d0a;font-size:40px;font-weight:700">0</text>
    <text class="lbl" x="26" y="106">COMPLIANCE VIOLATIONS</text>
    <text class="sub" x="26" y="128">every strategy, every run</text>
  </g>
</svg>
