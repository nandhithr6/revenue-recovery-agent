<svg viewBox="0 0 1040 190" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <style>
      .val { fill:#0d1526; font-size:38px; font-weight:700; }
      .lbl { fill:#4c5670; font-size:12.5px; font-weight:600; letter-spacing:0.6px; }
      .sub { fill:#8590a8; font-size:11px; }
      .note { fill:#8590a8; font-size:10px; font-style:italic; }
      .rule { stroke:#e3e8f2; stroke-width:1; }
    </style>
  </defs>

  <rect x="0" y="0" width="1040" height="190" rx="14" fill="#ffffff" stroke="#e3e8f2" stroke-width="1.5"/>
  <line class="rule" x1="260" y1="24" x2="260" y2="166"/>
  <line class="rule" x1="520" y1="24" x2="520" y2="166"/>
  <line class="rule" x1="780" y1="24" x2="780" y2="166"/>

  <g transform="translate(28,0)">
    <text class="val" x="0" y="72">₹5.97L</text>
    <rect x="2" y="80" width="30" height="3" rx="1.5" fill="#1655d1"/>
    <text class="lbl" x="0" y="104">NET RECOVERED</text>
    <text class="sub" x="0" y="124">baseline week · 500 cases</text>
  </g>

  <g transform="translate(288,0)">
    <text class="val" x="0" y="72">59.4%</text>
    <rect x="2" y="80" width="30" height="3" rx="1.5" fill="#1655d1"/>
    <text class="lbl" x="0" y="104">RECOVERY RATE</text>
    <text class="sub" x="0" y="124">297 of 500 cases</text>
    <text class="note" x="0" y="144">of the other 203, just 3 were</text>
    <text class="note" x="0" y="157">a genuine miss — see below</text>
  </g>

  <g transform="translate(548,0)">
    <text class="val" x="0" y="72" fill="#0a7d0a">250/250</text>
    <rect x="2" y="80" width="30" height="3" rx="1.5" fill="#0ca30c"/>
    <text class="lbl" x="0" y="104">ROBUSTNESS</text>
    <text class="sub" x="0" y="124">independent reseeded cohorts</text>
  </g>

  <g transform="translate(808,0)">
    <text class="val" x="0" y="72" fill="#0a7d0a">0</text>
    <rect x="2" y="80" width="30" height="3" rx="1.5" fill="#0ca30c"/>
    <text class="lbl" x="0" y="104">COMPLIANCE VIOLATIONS</text>
    <text class="sub" x="0" y="124">every strategy, every run</text>
  </g>
</svg>
